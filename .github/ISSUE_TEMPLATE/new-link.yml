name: Suggest a link
description: Propose a resource for the directory
title: "[link] "
labels: ["new-link"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks. Every entry in this directory states **what the thing does** and
        **where it parts ways with its neighbours**, so both of those fields are
        required below.

        Turkish is fine in any field — the directory is bilingual and the
        description gets written in both languages either way.

  - type: input
    id: url
    attributes:
      label: URL
      placeholder: https://…
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: Name
      placeholder: Short — the product's own name
    validations:
      required: true

  - type: dropdown
    id: cat
    attributes:
      label: Category
      options:
        - "Programming Languages"
        - "Web & Frontend"
        - "Backend, API & System Design"
        - "Mobile & Desktop"
        - "Databases"
        - "Practice & Challenges"
        - "Testing & QA"
        - "Game Development"
        - "AI · Models & Assistants"
        - "AI · Agents & Infrastructure"
        - "AI · RAG, Embeddings & Vectors"
        - "AI · Applied Tools"
        - "AI · Generative Media"
        - "DevOps & Infrastructure"
        - "Networking & Sysadmin"
        - "Self-Hosting & Personal Cloud"
        - "Hardware, CAD & Embedded"
        - "Electrical & Electronics"
        - "Smart Glasses & Wearables"
        - "Privacy & Personal Security"
        - "Offence, Defence & OSINT"
        - "CTF & Hands-on Labs"
        - "Certification & Career"
        - "Data Science & ML"
        - "Data Engineering"
        - "Science & Academia"
        - "Mathematics"
        - "Quantum Computing"
        - "Economics"
        - "Finance, Markets & Crypto"
        - "Media, Design & Files"
        - "Architecture & Building"
        - "Learning & Roadmaps"
        - "Free Books & Long Reads"
        - "Cheat Sheets & Quick Reference"
        - "Lists, Directories & Discovery"
        - "Open Source & Contributing"
        - "Editors, IDEs & Terminals"
        - "Online Playgrounds & Compilers"
        - "Converters, Formatters & Checkers"
        - "Productivity & Everyday Tools"
        - "Open Access & Archives"
        - "Piracy"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What does it do?
      description: A sentence or two. Not marketing copy — what it does.
      placeholder: |
        Example: A Postgres extension adding a vector type and an HNSW index.
    validations:
      required: true

  - type: textarea
    id: diff
    attributes:
      label: How does it differ?
      description: >
        This field is the only real value the directory has. Why this over
        something else doing the same job? If you don't know, write "I don't
        know" rather than leaving it empty — I'll look into it.
      placeholder: |
        Example: You keep vectors in the same transaction as the relational
        data instead of running a separate vector database.
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: Tags (optional)
      description: Comma separated. Unknown tags get mapped to the canonical set or dropped.
      placeholder: open-source, python, self-hosted

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The link currently resolves
          required: true
        - label: It is not a personal file or an account-gated dashboard
          required: true
