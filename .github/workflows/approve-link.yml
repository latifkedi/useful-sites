name: Approved link to pull request

# A submission sitting in an issue is worth nothing until someone transcribes
# it into data/notes/<category>.json, and transcription is exactly the step
# that gets put off.
# Label the issue `approved` and this opens a pull request with the record
# already written and links.js rebuilt.
#
# It opens a PR. It never merges one -- the description still needs a human
# pass. The record carries a "review" field saying so, and the build check
# fails on it, so the PR stays red until someone has done that pass.
#
# A pull request opened with GITHUB_TOKEN triggers no workflow, so the Build
# check is started on the branch explicitly (the last step). Pushes a person
# makes to the branch afterwards trigger it the normal way.

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write       # to start the Build check on the new branch

concurrency:
  group: approve-link-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  transcribe:
    timeout-minutes: 15
    if: >
      github.event.label.name == 'approved' &&
      contains(github.event.issue.labels.*.name, 'new-link')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Read the issue into a record
        id: parse
        continue-on-error: true
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python data/from_issue.py

      - name: Report back if the issue could not be used
        if: steps.parse.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const why = fs.existsSync('issue-error.txt')
              ? fs.readFileSync('issue-error.txt', 'utf8')
              : 'The issue could not be parsed.';
            const { owner, repo } = context.repo;
            const n = context.issue.number;
            await github.rest.issues.createComment({
              owner, repo, issue_number: n,
              body: 'I could not turn this into a record automatically:\n\n> ' +
                    why + '\n\nRemoving the `approved` label. Fix the issue ' +
                    'above and add it again, or transcribe it by hand.'
            });
            await github.rest.issues.removeLabel({
              owner, repo, issue_number: n, name: 'approved'
            }).catch(() => {});
            core.setFailed(why);

      - name: Rebuild the site data
        run: python data/build.py

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          N: ${{ github.event.issue.number }}
        run: |
          BRANCH="link/issue-$N"
          git config user.name  "link-bot[bot]"
          git config user.email "link-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "add link from #$N"
          git push -u origin "$BRANCH"
          # PR govdesi depoda duruyor. Heredoc denendi ve olmadi: YAML
          # girintisi yuzunden kapanis etiketi sutun 0'da olamiyor, bash de
          # girintili EOF'u kabul etmiyor.
          sed "s/ISSUENO/$N/g" .github/pr-body-link.md > /tmp/pr-body.md
          gh pr create --title "Add link from #$N" --body-file /tmp/pr-body.md --head "$BRANCH"
          gh workflow run build.yml --ref "$BRANCH" || echo "::warning::could not start the Build check"

      - name: Point the issue at the pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.issues.createComment({
              owner, repo, issue_number: context.issue.number,
              body: 'Transcribed into a pull request. It needs a description ' +
                    'pass before merging; its Build check stays red until then.'
            });
