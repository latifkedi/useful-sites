name: Link and repository health

# The only real enemy of a link directory is rot, and it arrives two ways:
#
#   1. The link dies          -> ci_check.py catches it
#   2. The repository is archived -> ci_check.py cannot: the page still
#                                    returns 200. ci_github.py catches it.
#
# Both reports land in one issue, and later weeks update that same issue
# instead of filing a new one.

on:
  schedule:
    - cron: "17 4 * * 1"        # Mondays, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write      # to write verified.json back
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet requests

      - name: Scan the links
        run: python data/ci_check.py
        continue-on-error: true      # exits 1 when it finds dead links

      - name: Audit the linked GitHub repositories
        run: python data/ci_github.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Audit description freshness
        run: python data/ci_fresh.py
        continue-on-error: true

      # verified.json feeds the "last verified" date shown on every entry, and
      # now also the dead marker. Without the commit below those dates freeze.
      - name: Commit the verification dates
        run: |
          if git diff --quiet data/verified.json; then
            echo "no change"
          else
            git config user.name  "link-check[bot]"
            git config user.email "link-check@users.noreply.github.com"
            git add data/verified.json
            git commit -m "chore: refresh verification dates"
            git push
          fi

      - name: Write the report as an issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const parts = [];
            for (const f of ['rapor.md', 'rapor-github.md', 'rapor-tazelik.md']) {
              if (fs.existsSync(f)) parts.push(fs.readFileSync(f, 'utf8'));
            }

            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'link-check'
            });

            if (!parts.length) {
              core.info('clean - no report produced');
              if (existing.data.length) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.data[0].number,
                  body: 'Nothing wrong in this week\'s scan. Closing.'
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: existing.data[0].number, state: 'closed'
                });
              }
              return;
            }

            const body = parts.join('\n\n---\n\n');
            if (existing.data.length) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.data[0].number, body
              });
              core.info(`updated #${existing.data[0].number}`);
            } else {
              await github.rest.issues.create({
                owner, repo,
                title: 'Maintenance: dead links and abandoned repositories',
                body, labels: ['link-check']
              });
              core.info('opened a new issue');
            }
