name: Build check

# Runs on every push and pull request. A broken part file does not raise -- it
# just produces fewer records -- so the point of this job is to notice a
# collapse before it is published, and to prove that what is committed matches
# what the build produces.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Rebuild the site data
        run: python data/build.py

      - name: Smoke test the output
        run: python data/test_build.py

      - name: Unit test the build helpers
        run: python data/test_helpers.py

      - name: Unit test the search/scoring logic
        run: node test_search.js

      # The generated files are committed, so a rebuild must be a no-op. If it
      # is not, someone edited links.js or a category page by hand and the next
      # build would quietly discard the change. index.html (its cache stamps),
      # the per-category feeds and the issue form's category list are generated
      # too; they were missing from this list, so they could drift unnoticed.
      - name: Committed output matches a fresh build
        run: |
          if ! git diff --quiet -- links.js links.en.js index.html sitemap.xml robots.txt feed.xml k/ feed/ README.md .github/ISSUE_TEMPLATE/new-link.yml; then
            echo "::error::A rebuild changed the committed output. Run 'python data/build.py' and commit the result."
            git --no-pager diff --stat -- links.js links.en.js index.html sitemap.xml robots.txt feed.xml k/ feed/ README.md .github/ISSUE_TEMPLATE/new-link.yml
            exit 1
          fi
          echo "clean"
