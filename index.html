/* Basliklar ve kayit adlari icin Source Serif 4 (SIL OFL). Yalnizca
   kullanilan karakterlere indirgendi ve tek agirliga sabitlendi: iki dosya
   toplam 25 KB. Degisken surumun tamami 1.2 MB idi, bu sitenin hiz
   iddiasiyla bagdasmazdi. Govde metni sistem yazi tipinde kaliyor -- ekranda
   okunakliligi zaten iyi ve indirilecek hicbir sey yok. */
@font-face{
  font-family:"Serif Fallback";
  src:local("Georgia"),local("Times New Roman"),local("Iowan Old Style");
  size-adjust:98.7%;ascent-override:105%;descent-override:34%;line-gap-override:0%;
}
@font-face{
  font-family:"Source Serif 4";font-style:normal;font-weight:400;font-display:swap;
  src:url("fonts/serif-400.woff2") format("woff2");
}
@font-face{
  font-family:"Source Serif 4";font-style:normal;font-weight:600;font-display:swap;
  src:url("fonts/serif-600.woff2") format("woff2");
}

/* ---------------------------------------------------------------- tokens */
:root{
  --bg:#fcfbf9;      --panel:#f5f2ec;
  --fg:#191817;      --dim:#57544e;      --faint:#77746d;
  --rule:#e4e0d8;    --rule2:#efebe3;
  --accent:#a8451f;  --accent-soft:#f6ece6;
  --serif:"Source Serif 4","Serif Fallback",Georgia,"Times New Roman",serif;
  --mark:#fbe6a0;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --step:cubic-bezier(.2,.6,.3,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1a1c20;    --panel:#22252a;
    --fg:#e2e0da;    --dim:#a3a09a;      --faint:#86837c;
    --rule:#2c3037;  --rule2:#24272c;
    --accent:#e78b62; --accent-soft:#2a211c;
    --mark:#5c4a15;
  }
}
:root[data-theme="dark"]{
  --bg:#1a1c20;    --panel:#22252a;
  --fg:#e2e0da;    --dim:#a3a09a;      --faint:#86837c;
  --rule:#2c3037;  --rule2:#24272c;
  --accent:#e78b62; --accent-soft:#2a211c;
  --mark:#5c4a15;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font:17px/1.62 var(--sans);
  font-feature-settings:"kern" 1;
  -webkit-font-smoothing:antialiased;
  padding:0 24px 96px;
}
::selection{background:var(--accent-soft);color:var(--fg)}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:1px}
.wrap{max-width:1280px;margin:0 auto}

/* ---------------------------------------------------------------- masthead */
header{padding:48px 0 22px;border-bottom:1px solid var(--rule)}
.masthead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
h1{font:600 31px/1.2 var(--serif);margin:0;letter-spacing:-.014em}
.sub{color:var(--dim);font-size:16.5px;line-height:1.7;margin:12px 0 0;max-width:66ch}
.hdr-actions{margin-left:auto;display:flex;gap:7px;align-items:center;padding-top:3px}
.btn{
  font:12.5px/1 var(--mono);color:var(--dim);background:none;
  border:1px solid var(--rule);padding:8px 11px;cursor:pointer;border-radius:3px;
  transition:color .12s var(--step),border-color .12s var(--step),background .12s var(--step);
}
.btn:hover{color:var(--fg);border-color:var(--faint);background:var(--panel)}
.btn:active{transform:translateY(.5px)}
/* dropdown: has to look identical to the buttons next to it */
.sel{position:relative;display:inline-flex;align-items:center;gap:6px;
  font:12.5px/1 var(--mono);color:var(--dim);
  border:1px solid var(--rule);padding:8px 11px;border-radius:3px;cursor:pointer;
  transition:color .12s var(--step),border-color .12s var(--step),background .12s var(--step)}
.sel:hover{color:var(--fg);border-color:var(--faint);background:var(--panel)}
.sel::after{content:"▾";font-size:10px;color:var(--faint)}
.sel select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.sel:focus-within{outline:2px solid var(--accent);outline-offset:2px}

/* ---------------------------------------------------------------- toolbar */
.tools{padding:18px 0 12px;border-bottom:1px solid var(--rule2)}
.searchrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#q{
  flex:1;min-width:220px;font:17px/1 var(--sans);color:var(--fg);background:var(--bg);
  border:1px solid var(--rule);border-radius:3px;padding:11px 13px;
  transition:border-color .12s var(--step),box-shadow .12s var(--step);
}
#q:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#q::placeholder{color:var(--faint)}
#sort{
  font:12.5px/1 var(--mono);color:var(--dim);background:var(--bg);
  border:1px solid var(--rule);border-radius:3px;padding:9px 10px;cursor:pointer;
}
#sort:hover{color:var(--fg);border-color:var(--faint)}
.count{font:12.5px/1 var(--mono);color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{
  font:12.5px/1 var(--mono);color:var(--faint);background:none;
  border:1px solid var(--rule);padding:5px 9px;cursor:pointer;border-radius:3px;
  transition:color .12s var(--step),border-color .12s var(--step),background .12s var(--step);
}
.tag b{font-weight:500;color:var(--dim);transition:color .12s var(--step)}
.tag:hover{border-color:var(--faint);background:var(--panel)}
.tag:hover b{color:var(--fg)}
.tag[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tag.more{border-style:dashed;color:var(--dim)}
.tag.more:hover{color:var(--accent);border-color:var(--accent)}
.tag[aria-pressed="true"] b{color:var(--accent)}

/* ---------------------------------------------------------------- layout */
.cols{display:grid;grid-template-columns:212px 1fr;gap:48px;margin-top:30px;align-items:start}
nav ol{list-style:none;margin:0;padding:0}
nav li{border-bottom:1px solid var(--rule2)}
nav li:last-child{border-bottom:0}
nav a{
  display:flex;justify-content:space-between;gap:10px;align-items:baseline;
  padding:7px 0;color:var(--dim);text-decoration:none;font-size:15px;line-height:1.45;
  transition:color .12s var(--step),padding-left .14s var(--step);
}
nav a:hover{color:var(--fg);padding-left:4px}
nav a.on{color:var(--accent);font-weight:600}
nav a.on::before{content:"▸ ";color:var(--accent)}
nav a.empty{opacity:.62}
nav .n{font:11.5px/1.4 var(--mono);color:var(--faint);font-variant-numeric:tabular-nums}
.navback{display:none;width:100%;margin:0 0 14px;text-align:left}
.navback.show{display:block}

/* ---------------------------------------------------------------- liste */
section{margin:0 0 64px;scroll-margin-top:24px}
h2{
  font:13px/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;
  color:var(--faint);font-weight:400;margin:0 0 4px;padding-bottom:11px;
  border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;gap:12px;
}
h2 .n{font-variant-numeric:tabular-nums}
/* two links per row */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 44px}
.item{
  padding:15px 0 15px 14px;border-bottom:1px solid var(--rule2);
  border-left:2px solid transparent;margin-left:-16px;min-width:0;
  transition:border-color .14s var(--step);
}
.item:hover{border-left-color:var(--accent)}
.item-h{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.foot{
  display:flex;gap:10px 16px;align-items:baseline;flex-wrap:wrap;
  margin:10px 0 0;padding-top:9px;border-top:1px dotted var(--rule);
}
.foot .meta{
  margin-left:auto;display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;
  font:11.5px/1.5 var(--mono);color:var(--faint);
}
.foot .sep{color:var(--rule)}
.item a.name{
  font:600 18px/1.3 var(--serif);text-decoration:none;letter-spacing:-.004em;
  transition:color .12s var(--step);
}
.item a.name:hover{color:var(--accent)}
.host{font:12.5px/1 var(--mono);color:var(--faint);overflow:hidden;text-overflow:ellipsis}
.desc{margin:6px 0 0;color:var(--dim);font-size:15.5px;line-height:1.7}
.itags{margin:0;font:12.5px/1.5 var(--sans);color:var(--faint);min-width:0}
.itags span{cursor:pointer;transition:color .12s var(--step)}
.itags span:hover{color:var(--accent)}
.age{font:11.5px/1 var(--mono);color:var(--faint);white-space:nowrap}

/* start-here marker: two or three entries per category */
.dot{color:var(--accent);font-size:9px;line-height:1;position:relative;top:-1px}
.item.pick a.name{color:var(--accent)}
.item.pick{border-left-color:var(--accent-soft)}
.item.pick:hover{border-left-color:var(--accent)}
.pickbtn{border-color:var(--accent-soft)}
.pickbtn .dot{font-size:8px}

/* category introduction */
.intro{
  color:var(--dim);font-size:15px;line-height:1.72;margin:14px 0 6px;
  max-width:80ch;padding-left:14px;border-left:2px solid var(--rule);
}
/* related entries */
.rel{margin:8px 0 0;font:12.5px/1.6 var(--mono);color:var(--faint)}
.rel b{font-weight:400;color:var(--faint)}
.rel a{color:var(--dim);text-decoration:none;cursor:pointer}
.rel a:hover{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
/* source and verification badges */
.badge{font:11.5px/1 var(--mono);color:var(--faint);white-space:nowrap}
.badge.ext{color:var(--accent);opacity:.8}
.badge.dead{color:#fff;background:var(--accent);border-color:var(--accent);opacity:1}
.badge.repo{border:1px solid currentColor;border-radius:2px;padding:1px 5px;opacity:1}
.badge.repo.warn{color:var(--dim)}
.badge.repo.stop{color:var(--accent)}
.arch{
  font:11.5px/1 var(--mono);color:var(--faint);text-decoration:none;
  border-bottom:1px dotted var(--rule);padding-bottom:1px;
}
.arch:hover{color:var(--accent);border-bottom-color:var(--accent)}
.one .grid{grid-template-columns:1fr}
.one .item{border-left-color:var(--accent-soft)}
.onemore{margin:22px 0 0;font:12.5px/1 var(--mono)}
.onemore a{color:var(--dim);text-decoration:none}
.onemore a:hover{color:var(--accent)}
.srcbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.srcbar .lbl{font:12px/1 var(--mono);color:var(--faint);margin-right:2px}
mark{background:var(--mark);color:inherit;padding:0 2px;border-radius:2px}

/* ---------------------------------------------------------------- pagination */
.pager{display:flex;gap:6px;align-items:center;padding:22px 0 0;flex-wrap:wrap}
.pg{
  font:12.5px/1 var(--mono);color:var(--dim);background:none;border:1px solid var(--rule);
  padding:7px 10px;cursor:pointer;border-radius:3px;min-width:32px;
  font-variant-numeric:tabular-nums;
  transition:color .12s var(--step),border-color .12s var(--step),background .12s var(--step);
}
.pg:hover:not(:disabled){border-color:var(--faint);color:var(--fg);background:var(--panel)}
.pg[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pg:disabled{opacity:.32;cursor:default}
.pgpos{font:12px/1 var(--mono);color:var(--faint);margin-left:8px}

/* ---------------------------------------------------------------- ana sayfa */
/* Her sey tek sayfada dururken acilista 378 kayit ve 6.300 DOM dugumu
   ciziliyordu; hem yavas hem de gezilecek bir sey birakmiyordu. Giris artik
   kategori kartlari: 24 kart, kayit yok. Kayitlar kategoriye girilince
   geliyor. */
.home{padding:6px 0 0}
.lead{
  font:400 19.5px/1.62 var(--serif);color:var(--fg);max-width:60ch;
  margin:0 0 30px;padding-bottom:26px;border-bottom:1px solid var(--rule);
}
.lead b{font-weight:600;color:var(--accent)}
.hsec{font:13px/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;
  color:var(--faint);margin:0 0 16px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.card{
  background:var(--bg);padding:17px 18px 16px;text-decoration:none;color:inherit;
  display:flex;flex-direction:column;gap:7px;min-height:112px;
  transition:background .13s var(--step);
}
.card:hover{background:var(--panel)}
.card:hover .ch{color:var(--accent)}
.ch{font:600 17px/1.28 var(--serif);letter-spacing:-.004em;
  transition:color .12s var(--step);display:flex;gap:10px;align-items:baseline}
/* Kategoriler esit buyuklukte degil (99 kayda karsi 11) ama kartlar esitti.
   Baslik boyu uc kademe, altinda hacimle orantili ince bir cubuk: agirlik
   izgarayi bozmadan okunuyor. */
.card.lg .ch{font-size:19.5px}
.card.md .ch{font-size:18px}
.bar{height:2px;background:var(--rule);border-radius:1px;overflow:hidden;margin:1px 0 0}
.bar i{display:block;height:100%;background:var(--accent);opacity:.5}
.card:hover .bar i{opacity:.85}
.ch .n{font:11.5px/1 var(--mono);color:var(--faint);font-variant-numeric:tabular-nums;
  margin-left:auto;flex:none}
.cd{font-size:13.5px;line-height:1.55;color:var(--dim);margin:0}
.cs{font:11.5px/1.5 var(--mono);color:var(--faint);margin:auto 0 0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hpicks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 34px;
  margin:0 0 38px}
.hpick{padding:11px 0 11px 13px;border-left:2px solid var(--accent-soft);
  border-bottom:1px solid var(--rule2);transition:border-color .13s var(--step)}
.hpick:hover{border-left-color:var(--accent)}
.hpick a{font:600 16px/1.3 var(--serif);text-decoration:none;color:var(--accent)}
.hpick p{margin:5px 0 0;font-size:13.5px;line-height:1.55;color:var(--dim)}
.hlinks{display:flex;gap:24px;flex-wrap:wrap;margin:26px 0 0}
.hlinks a{font:12.5px/1 var(--mono);color:var(--dim);text-decoration:none}
.hlinks a:hover{color:var(--accent)}

.empty{padding:64px 0;color:var(--dim);font-size:16px}
.empty code{font:14px var(--mono);color:var(--accent)}

#top{
  position:fixed;right:24px;bottom:24px;z-index:30;
  opacity:0;pointer-events:none;transform:translateY(6px);
  transition:opacity .18s var(--step),transform .18s var(--step);
  background:var(--bg);
}
#top.show{opacity:1;pointer-events:auto;transform:none}

footer{
  margin-top:64px;padding-top:22px;border-top:1px solid var(--rule);
  color:var(--faint);font-size:14px;line-height:1.85;max-width:74ch;
}
footer kbd{font:12px var(--mono);border:1px solid var(--rule);border-radius:3px;padding:2px 5px;color:var(--dim)}
footer a{color:var(--dim)}
/* So keyboard users do not tab through 63 tags to reach the content. */
.skip{
  position:absolute;left:-9999px;top:0;z-index:40;
  font:13px/1 var(--mono);color:var(--bg);background:var(--accent);
  padding:12px 18px;border-radius:0 0 3px 0;text-decoration:none;
}
.skip:focus{left:0}

/* ---------------------------------------------------------------- submit */
dialog#sub{
  border:1px solid var(--rule);border-radius:4px;padding:0;
  background:var(--bg);color:var(--fg);
  width:min(660px,calc(100vw - 32px));max-height:calc(100vh - 48px);
}
dialog#sub::backdrop{background:rgba(0,0,0,.45)}
.sub-h{display:flex;align-items:baseline;gap:12px;padding:20px 22px 0}
.sub-h h2{margin:0;font-size:19px;font-weight:600;letter-spacing:-.012em}
.sub-h .btn{margin-left:auto}
.sub-tabs{display:flex;padding:14px 22px 0;border-bottom:1px solid var(--rule)}
.sub-tabs button{
  font:12.5px/1 var(--mono);color:var(--dim);background:none;border:0;
  border-bottom:2px solid transparent;padding:10px 13px;cursor:pointer;
  transition:color .12s var(--step),border-color .12s var(--step);
}
.sub-tabs button:hover{color:var(--fg)}
.sub-tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.sub-body{padding:18px 22px 4px;overflow-y:auto;max-height:calc(100vh - 250px)}
.fld{margin:0 0 14px}
.fld label{
  display:block;font:11.5px/1 var(--mono);color:var(--faint);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;
}
.fld input,.fld textarea,.fld select{
  width:100%;font:15px/1.55 var(--sans);color:var(--fg);background:var(--bg);
  border:1px solid var(--rule);border-radius:3px;padding:9px 11px;
}
.fld textarea{resize:vertical;min-height:62px}
.fld input:focus,.fld textarea:focus,.fld select:focus{
  outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sub-note{font-size:13.5px;color:var(--dim);line-height:1.68;margin:0 0 16px}
.sub-note b{color:var(--fg);font-weight:600}
.sub-warn{color:var(--accent);font-size:13.5px;line-height:1.6;margin:8px 0 0;min-height:1px}
.drop{
  border:1px dashed var(--rule);border-radius:4px;padding:30px 18px;
  text-align:center;color:var(--dim);font-size:14.5px;line-height:1.6;cursor:pointer;
  transition:border-color .12s var(--step),background .12s var(--step),color .12s var(--step);
}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.drop code{font:12.5px var(--mono);color:var(--faint)}
.stat{
  font:12.5px/1.7 var(--mono);color:var(--dim);margin:16px 0 0;
  padding-top:12px;border-top:1px solid var(--rule);
}
.stat b{color:var(--accent);font-weight:500;font-variant-numeric:tabular-nums}
.plist{margin:10px 0 0;max-height:210px;overflow-y:auto}
.plist div{padding:8px 0;border-bottom:1px solid var(--rule);font-size:14.5px;line-height:1.45}
.plist div:last-child{border-bottom:0}
.plist span{display:block;font:11.5px var(--mono);color:var(--faint);word-break:break-all;margin-top:2px}
.sub-f{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:16px 22px 20px}
.sub-f .msg{font:12px/1.5 var(--mono);color:var(--faint);margin-left:auto;text-align:right}
.btn.primary{color:var(--accent);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.btn:disabled{opacity:.35;cursor:default}
.btn:disabled:hover{color:var(--dim);border-color:var(--rule);background:none}

@media (max-width:1080px){
  .grid{grid-template-columns:1fr}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hpicks{grid-template-columns:repeat(2,minmax(0,1fr))}
}

@media (max-width:900px){
  .cols{grid-template-columns:1fr;gap:0}
  nav{margin-bottom:26px;padding-bottom:14px;border-bottom:1px solid var(--rule)}
  nav ol{display:flex;flex-wrap:wrap;gap:0 16px}
  nav li{border-bottom:0}
  nav a{padding:6px 0}
  nav a:hover{padding-left:0}
}

@media (max-width:720px){
  body{padding:0 16px 72px}
  header{padding:28px 0 16px}
  h1{font-size:23px}
  .sub{font-size:15.5px}
  .masthead{gap:14px}
  .hdr-actions{margin-left:0;width:100%;padding-top:0;flex-wrap:wrap}
  /* Keep touch targets at 44px (WCAG 2.2 target size). The height comes
     from min-height rather than padding, so a change in font size cannot
     shrink the target. */
  .btn,.sel,.tag,.pg,#sort{
    min-height:44px;display:inline-flex;align-items:center;justify-content:center;
  }
  .btn,.sel{padding:0 14px;font-size:13px}
  .tag{padding:0 12px;font-size:13px}
  .pg{padding:0 14px;font-size:13px;min-width:44px}
  #sort{flex:1 1 100%;padding:0 12px;font-size:13px}
  #q{flex:1 1 100%;min-height:48px;padding:0 14px}
  .count{width:100%}
  .tags,.srcbar{gap:8px}
  .item{margin-left:0;padding:14px 0 14px 12px}
  .intro{font-size:14.5px;padding-left:12px}
  .desc{font-size:15px}
  .item-h{gap:7px}
  .badge,.age{font-size:11px}
  /* 24 kart mobilde cok uzun bir kaydirma oluyordu. Ornek satiri ve giris
     cumlesi gidiyor, geriye ad ve sayi kaliyor -- gezinme icin yeterli. */
  .cards{grid-template-columns:1fr}
  .card{min-height:0;padding:13px 15px;gap:5px;flex-direction:row;align-items:baseline}
  .card .cs,.card .cd,.card .bar{display:none}
  .card .ch{font-size:16.5px;flex:1}
  .card.lg .ch,.card.md .ch{font-size:16.5px}
  .hpicks{grid-template-columns:1fr;gap:0}
  .lead{font-size:18px}
  .foot{gap:6px 12px}
  .foot .meta{margin-left:0;width:100%}
  #top{right:14px;bottom:14px;padding:13px 15px}
  footer{font-size:13.5px}

  dialog#sub{width:100vw;max-width:100vw;max-height:100vh;border-radius:0;border-width:1px 0 0}

  .sub-f .msg{flex:1 1 100%;margin-left:0;text-align:left}
}

@media (max-width:380px){

}

var data  = window.LINKS || [];
var theme = localStorage.getItem("theme");
var lang, q, activeTags, activeCat, sortBy, pages, onlyPicks, activeSrc, single, recent;

var $ = function(s){return document.querySelector(s)};
var esc = function(s){return String(s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};

function host(u){ try{ return new URL(u).hostname.replace(/^www\./,"") }catch(e){ return "" } }
function fold(s){
  return s.toLowerCase()
    .replace(/[ıİ]/g,"i").replace(/[şŞ]/g,"s").replace(/[ğĞ]/g,"g")
    .replace(/[üÜ]/g,"u").replace(/[öÖ]/g,"o").replace(/[çÇ]/g,"c");
}

data.forEach(function(d,i){
  d._i = i;
  d._h = host(d.url);
  var lbl = (d.tags||[]).map(function(t){
    var l = (window.TAGLABELS||{})[t];
    return l ? l[0]+" "+l[1] : t;
  }).join(" ");
  d._s = fold([d.name,d.tr,(d.tags||[]).join(" "),lbl,d._h,d.cat_tr,d.cat_en].join(" "));
});

/* Ingilizce aciklamalar ayri dosyada ve sonradan geliyor, dolayisiyla ilk
   indeks yalnizca Turkce metni tasiyor. Bunu tazelemezsek Ingilizce moddaki

   geciyor, sonuc bos donuyor. */
var enIndexed = false;
function indexEN(){
  if(enIndexed || !window.LINKS_EN) return;
  enIndexed = true;
  data.forEach(function(d){
    var t = window.LINKS_EN[d._i];
    if(t) d._s += " " + fold(t);
  });
}

var CATS = (function(){
  var seen = [], out = [];
  data.forEach(function(d){
    if(seen.indexOf(d.cat) < 0){ seen.push(d.cat); out.push({key:d.cat, tr:d.cat_tr, en:d.cat_en}); }
  });
  return out;
})();

var TAGCOUNT = {};
data.forEach(function(d){ (d.tags||[]).forEach(function(t){ TAGCOUNT[t]=(TAGCOUNT[t]||0)+1 }) });
var TAGLBL = window.TAGLABELS || {};
function tagLabel(t){
  var l = TAGLBL[t];
  return l ? l[lang === "tr" ? 0 : 1] : t;
}
var SRCMAP = window.SOURCES || {};
var SRCCOUNT = {};
data.forEach(function(d){ SRCCOUNT[d.src] = (SRCCOUNT[d.src]||0) + 1 });
var INTROS = window.INTROS || {};
var NAMEIDX = {};
data.forEach(function(d){ NAMEIDX[d.name] = d });
var PICKCOUNT = data.filter(function(d){ return d.pick }).length;
var ALLTAGS = Object.keys(TAGCOUNT).sort(function(a,b){
  return TAGCOUNT[b]-TAGCOUNT[a] || a.localeCompare(b,"tr");
});

/* ------------------------------------------------------------ URL state */
function readURL(){
  var p = new URLSearchParams(location.search);
  q          = (p.get("q") || "").trim();
  activeCat  = p.get("cat") || null;
  sortBy     = p.get("sort") || "cat";
  activeTags = (p.get("tag") || "").split(",").filter(Boolean);
  onlyPicks  = p.get("pick") === "1";
  activeSrc  = p.get("src") || null;
  single     = p.get("e") || null;
  recent     = p.get("new") === "1";
  if(activeSrc && !SRCMAP[activeSrc]) activeSrc = null;
  lang       = p.get("lang") || localStorage.getItem("lang") || "tr";
  if(!T[lang]) lang = "tr";
  if(!T.tr.sorts[sortBy]) sortBy = "cat";
  if(activeCat && !CATS.some(function(c){return c.key === activeCat})) activeCat = null;
  activeTags = activeTags.filter(function(t){ return TAGCOUNT[t] });
  pages = {};
  var pg = parseInt(p.get("p"), 10);
  if(pg > 1) pages[activeCat && sortBy === "cat" ? activeCat : "_"] = pg;
}

function writeURL(push){
  var p = new URLSearchParams();
  if(q) p.set("q", q);
  if(activeCat) p.set("cat", activeCat);
  if(activeTags.length) p.set("tag", activeTags.join(","));
  if(onlyPicks) p.set("pick", "1");
  if(activeSrc) p.set("src", activeSrc);
  if(single) p.set("e", single);
  if(recent) p.set("new", "1");
  if(sortBy !== "cat") p.set("sort", sortBy);
  if(lang !== "tr") p.set("lang", lang);
  var pg = pages[activeCat && sortBy === "cat" ? activeCat : "_"];
  if(pg > 1) p.set("p", pg);
  var s = p.toString();
  history[push ? "pushState" : "replaceState"]({}, "", location.pathname + (s ? "?"+s : ""));
}

/* ------------------------------------------------------------ filter & sort */
function keep(d){ return matches(d, false) }

function matches(d, ignoreCat){
  if(onlyPicks && !d.pick) return false;
  if(activeSrc && d.src !== activeSrc) return false;
  if(!ignoreCat && activeCat && d.cat !== activeCat) return false;
  for(var i=0;i<activeTags.length;i++){
    if((d.tags||[]).indexOf(activeTags[i]) < 0) return false;
  }
  if(!q) return true;
  var terms = fold(q).split(/\s+/).filter(Boolean);
  for(var j=0;j<terms.length;j++){ if(d._s.indexOf(terms[j]) < 0) return false; }
  return true;
}

/* Arama alt dize eslesmesiydi ve sirasizdi: "docker" yazinca adi Docker olan
   kayitla aciklamasinda docker gecen kayit ayni agirliktaydi. Puanlama nerede
   eslestigine bakiyor -- ad en agir, sonra etiket, sonra alan adi, en hafifi
   aciklama. Bas harften eslesme ayrica odullendiriliyor ki kisa sorgular
   dogru kaydi one cikarsin. */
function score(d, terms){
  var p = 0, ad = fold(d.name), et = (d.tags||[]).join(" "), h = d._h;
  for(var i=0;i<terms.length;i++){
    var t = terms[i], v = 0;
    if(ad === t) v = 60;
    else if(ad.indexOf(t) === 0) v = 34;
    else if(ad.indexOf(t) >= 0) v = 20;
    if(fold(et).indexOf(t) >= 0) v += 9;
    if(h.indexOf(t) >= 0) v += 6;
    if(!v && d._s.indexOf(t) >= 0) v = 2;
    p += v;
  }
  /* Baslangic noktalari esit puanda one geciyor: ayni isi goren iki kayittan
     hangisine once bakilacagi zaten isaretlenmis durumda. */
  if(d.pick) p += 3;
  return p;
}

function sorted(rows){
  var r = rows.slice();
  if(sortBy === "az")  r.sort(function(a,b){ return a.name.localeCompare(b.name,"tr") });
  else if(sortBy === "new") r.sort(function(a,b){ return b.added - a.added || a.name.localeCompare(b.name,"tr") });
  else if(q){
    var terms = fold(q).split(/\s+/).filter(Boolean);
    r.forEach(function(d){ d._p = score(d, terms) });
    r.sort(function(a,b){ return b._p - a._p || a.name.localeCompare(b.name,"tr") });
  }
  return r;
}

function hl(text){
  if(!q) return esc(text);
  var terms = fold(q).split(/\s+/).filter(Boolean).sort(function(a,b){return b.length-a.length});
  var src = esc(text), f = fold(src), out = "", i = 0;
  while(i < src.length){
    var len = 0;
    for(var t=0;t<terms.length;t++){
      if(terms[t] && f.startsWith(terms[t], i)){ len = terms[t].length; break; }
    }
    if(len){ out += "<mark>"+src.substr(i,len)+"</mark>"; i += len; }
    else { out += src[i]; i++; }
  }
  return out;
}

function descOf(d){
  return (lang === "en" && window.LINKS_EN && window.LINKS_EN[d._i]) || d.tr;
}
var AYLAR = {
  tr:["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"],
  en:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]
};
function whenOf(d){
  var t = new Date(d.added * 1000);
  return AYLAR[lang][t.getMonth()] + " " + t.getFullYear();
}
function srcLabel(d){
  var s = SRCMAP[d.src];
  return s ? s[lang === "tr" ? "label_tr" : "label_en"] : d.src;
}
function srcNote(d){
  var s = SRCMAP[d.src], n = s ? s[lang === "tr" ? "note_tr" : "note_en"] : "";
  if(d.ver) n += (n ? " · " : "") + T[lang].verified(d.ver) + (d.verw ? " " + T[lang].verwarn : "");
  return n;
}

function itemHTML(d, showYear){
  var SEP = '<span class="sep">·</span>';
  /* Kunye satiri: bakilan sey ad ve aciklama, bunlar dogrulama bilgisi.
     Ayni satirda durunca hangisinin once okunacagi belirsiz kaliyordu. */
  /* Depo sagligi. Bir kayit mukemmel yanit verirken arkasindaki proje iki
     yildir durmus olabilir; denetim bunu biliyordu ama yalnizca issue'ya
     yaziyordu. Dizinin tezi tam olarak bu ayrimdi, artik kayitta duruyor. */
  var rt = "";
  if(d.hs){
    var tip = T[lang].repoTip[d.hs];
    rt = '<span class="badge repo '+(d.hs==="bayat"?"warn":"stop")+'" title="'+
         esc(typeof tip === "function" ? tip(d.hp) : tip)+'">'+
         esc(T[lang].repo[d.hs])+'</span>';
  }
  var meta = ['<span class="host">'+esc(d._h)+'</span>',
              '<span class="badge'+(d.src!=="kedi"?' ext':'')+'" title="'+esc(srcNote(d))+'">'+
                esc(srcLabel(d))+'</span>'];
  if(rt) meta.push(rt);
  if(showYear) meta.push('<span class="age">'+whenOf(d)+'</span>');
  meta.push('<a class="arch" href="'+esc(ARCHIVE+d.url)+'" target="_blank" '+
            'rel="noopener noreferrer" title="'+esc(T[lang].archTip)+'">'+esc(T[lang].arch)+'</a>');
  meta.push('<a class="arch perma" href="?e='+encodeURIComponent(d.name)+'" '+
            'data-perma="'+esc(d.name)+'" title="'+esc(T[lang].permaTip)+'">'+
            esc(T[lang].perma)+'</a>');

  return '<article class="item'+(d.pick?' pick':'')+'"><div class="item-h">'+
    (d.pick ? '<span class="dot" title="'+esc(T[lang].pickTip)+'">◆</span>' : '')+
    '<a class="name" href="'+esc(d.url)+'" target="_blank" rel="noopener noreferrer">'+hl(d.name)+'</a>'+
    (d.dead ? '<span class="badge dead" title="'+esc(T[lang].deadTip)+'">'+
              esc(T[lang].dead)+'</span>' : '')+
    '</div><p class="desc">'+hl(descOf(d))+'</p>'+
    '<div class="foot">'+
      ((d.tags||[]).length
        ? '<span class="itags">'+d.tags.map(function(t){
            return '<span data-tag="'+esc(t)+'">'+esc(tagLabel(t))+'</span>' }).join(" "+SEP+" ")+'</span>'
        : '<span class="itags"></span>')+
      '<span class="meta">'+meta.join(SEP)+'</span>'+
    '</div>'+
    ((d.rel||[]).length
      ? '<p class="rel"><b>'+esc(T[lang].rel)+'</b> '+d.rel.map(function(n){
          return '<a data-rel="'+esc(n)+'">'+esc(n)+'</a>' }).join(" · ")+'</p>'
      : '')+'</article>';
}

function pagerHTML(key, page, total, L){
  if(total <= 1) return "";
  var out = ['<div class="pager">'];
  out.push('<button class="pg" data-pg="'+key+':'+(page-1)+'"'+(page<=1?' disabled':'')+'>‹ '+L.prev+'</button>');
  var from = Math.max(1, page-2), to = Math.min(total, from+4);
  from = Math.max(1, Math.min(from, to-4));
  if(from > 1) out.push('<button class="pg" data-pg="'+key+':1">1</button>'+(from>2?'<span class="pgpos">…</span>':''));
  for(var i=from;i<=to;i++){
    out.push('<button class="pg" data-pg="'+key+':'+i+'"'+(i===page?' aria-current="true"':'')+'>'+i+'</button>');
  }
  if(to < total) out.push((to<total-1?'<span class="pgpos">…</span>':'')+'<button class="pg" data-pg="'+key+':'+total+'">'+total+'</button>');
  out.push('<button class="pg" data-pg="'+key+':'+(page+1)+'"'+(page>=total?' disabled':'')+'>'+L.next+' ›</button>');
  out.push('<span class="pgpos">'+L.page(page,total)+'</span></div>');
  return out.join("");
}

/* Kategori kartinda gosterilecek ilk cumle: giris metninin tamami cok uzun. */
function firstSentence(t){
  var m = /^(.{40,150}?[.!?])(\s|$)/.exec(t || "");
  return m ? m[1] : (t || "").slice(0, 120);
}

/* Acilista 63 etiket dugmesi birden goruntuyu doldurup asil icerigi asagi
   itiyordu. Ilk on bes gorunur, kalani katli; secili bir etiket kesimin
   disinda kalsa bile her zaman gosteriliyor, yoksa aktif suzgec kayboluyor. */
var TAG_HEAD = 15;
var tagsOpen = false;

function tagbarHTML(L){
  var goster = ALLTAGS.slice(0, TAG_HEAD);
  activeTags.forEach(function(t){
    if(goster.indexOf(t) < 0 && ALLTAGS.indexOf(t) >= 0) goster.push(t);
  });
  var liste = tagsOpen ? ALLTAGS : goster;
  var gizli = ALLTAGS.length - liste.length;

  return liste.map(function(t){
    return '<button class="tag" type="button" data-tag="'+esc(t)+'" aria-pressed="'+
           (activeTags.indexOf(t)>=0)+'"><b>'+esc(tagLabel(t))+'</b> '+TAGCOUNT[t]+'</button>';
  }).join("") +
  (gizli > 0 || tagsOpen
    ? '<button class="tag more" type="button" id="tagmore" aria-expanded="'+tagsOpen+'">'+
      (tagsOpen ? esc(L.tagLess) : esc(L.tagMore(gizli)))+'</button>'
    : "");
}

/* Son eklenenler. Ayri bir gorunum olmasinin sebebi arastirma: bir dizine
   geri donmenin en yaygin sebebi "yeni ne var" sorusu, ve siralama secenegi
   bunu karsilamiyor -- kullanicinin once siralamayi degistirmesi gerekiyor. */
/* Akisla ayni sayi. Doksan kayitlik bir alim tek gune dustugunde ay
   gruplamasi tek bloga dusuyor; kirk hem o durumda okunabilir kaliyor
   hem de ciziim maliyetini giris sayfasiyla ayni mertebede tutuyor. */
var RECENT_N = 40;

function recentHTML(L){
  var rows = data.slice().sort(function(a, b){
    return b.added - a.added || a.name.localeCompare(b.name, "tr");
  }).slice(0, RECENT_N);

  var gruplar = [], sonAy = null;
  rows.forEach(function(d){
    var ay = whenOf(d);
    if(ay !== sonAy){ gruplar.push({ay:ay, kayit:[]}); sonAy = ay; }
    gruplar[gruplar.length - 1].kayit.push(d);
  });

  return '<div class="home"><p class="lead">'+esc(L.recentLead(rows.length))+'</p>'+
    gruplar.map(function(g){
      return '<section><h2><span>'+esc(g.ay)+'</span>'+
             '<span class="n">'+g.kayit.length+'</span></h2><div class="grid">'+
             g.kayit.map(function(d){ return itemHTML(d, false) }).join("")+
             '</div></section>';
    }).join("")+'</div>';
}

function homeHTML(L){
  var byCat = {};
  data.forEach(function(d){ (byCat[d.cat] = byCat[d.cat] || []).push(d) });

  var picks = data.filter(function(d){ return d.pick });
  /* Gunun secimi degil, kategoriye gore dagitilmis sabit bir orneklem:
     her acilista ayni sey gorunsun, sayfa tahmin edilebilir kalsin. */
  var seen = {}, strip = [];
  picks.forEach(function(d){
    if(seen[d.cat] || strip.length >= 6) return;
    seen[d.cat] = 1; strip.push(d);
  });

  var enBuyuk = 1;
  CATS.forEach(function(c){ enBuyuk = Math.max(enBuyuk, (byCat[c.key] || []).length) });

  var cards = CATS.map(function(c){
    var rows = byCat[c.key] || [];
    if(!rows.length) return "";
    var intro = (INTROS[c.key] || ["",""])[lang === "tr" ? 0 : 1];
    /* Alfabetik ilk uc kayit kotu ornek oluyor ("1000 Projects, 20 Proje...").
       Once o kategorinin baslangic noktalari, yetmezse arasindan secilenler. */
    var sec = rows.filter(function(d){ return d.pick }).slice(0, 3);
    if(sec.length < 3){
      var step = Math.max(1, Math.floor(rows.length / 4));
      for(var i = 0; i < rows.length && sec.length < 3; i += step){
        if(sec.indexOf(rows[i]) < 0) sec.push(rows[i]);
      }
    }
    var ornek = sec.map(function(d){ return d.name }).join(" · ");
    var tier = rows.length >= 60 ? " lg" : (rows.length >= 34 ? " md" : "");
    var pay = Math.round(rows.length / enBuyuk * 100);
    return '<a class="card'+tier+'" href="?cat='+esc(c.key)+'" data-cat="'+esc(c.key)+'">'+
             '<span class="ch">'+esc(c[lang])+'<span class="n">'+rows.length+'</span></span>'+
             '<span class="bar"><i style="width:'+pay+'%"></i></span>'+
             '<p class="cd">'+esc(firstSentence(intro))+'</p>'+
             '<span class="cs">'+esc(ornek)+'</span>'+
           '</a>';
  }).join("");

  return '<div class="home">'+
    '<p class="lead">'+L.lead(data.length, CATS.length)+'</p>'+
    (strip.length
      ? '<p class="hsec">'+esc(L.hStart)+'</p><div class="hpicks">'+
        strip.map(function(d){
          return '<div class="hpick"><a href="'+esc(d.url)+'" target="_blank" '+
                 'rel="noopener noreferrer">'+esc(d.name)+'</a>'+
                 '<p>'+esc(firstSentence(descOf(d)))+'</p></div>';
        }).join("")+'</div>'
      : "")+
    '<p class="hsec">'+esc(L.hCats)+'</p>'+
    '<div class="cards">'+cards+'</div>'+
    '<p class="hlinks">'+
      '<a href="?new=1" data-recent="1">'+esc(L.recent)+' →</a>'+
      '<a href="?sort=az" data-all="1">'+esc(L.hAll)+'</a>'+
    '</p>'+
  '</div>';
}

function introHTML(cat){
  var t = INTROS[cat];
  return t ? '<p class="intro">'+esc(t[lang === "tr" ? 0 : 1])+'</p>' : "";
}

function block(key, label, items, L, showYear, cat){
  var total = Math.max(1, Math.ceil(items.length / PER_PAGE));
  var page  = Math.min(Math.max(pages[key]||1, 1), total);
  pages[key] = page;
  return '<section id="c-'+key+'"><h2><span>'+esc(label)+'</span>'+
         '<span class="n">'+items.length+'</span></h2>'+
         (cat ? introHTML(cat) : "")+'<div class="grid">'+
         items.slice((page-1)*PER_PAGE, page*PER_PAGE)
              .map(function(d){ return itemHTML(d, showYear) }).join("")+
         '</div>'+pagerHTML(key, page, total, L)+'</section>';
}

function render(){
  var L = T[lang];
  document.documentElement.lang = lang;
  document.title            = L.title;
  $("#t-title").textContent = L.title;
  $("#t-sub").textContent   = L.sub;
  $("#q").placeholder       = L.ph;
  if($("#q").value !== q) $("#q").value = q;
  $("#rand").textContent    = L.rand;
  $("#skip").textContent    = L.skip;
  $("#back").textContent    = L.back;
  $("#foot").innerHTML      = L.foot + "<br>" + L.kb;
  $("#back").classList.toggle("show", !!(activeCat || single || recent));

  $("#sort").innerHTML = Object.keys(L.sorts).map(function(k){
    return '<option value="'+k+'"'+(k===sortBy?' selected':'')+'>'+esc(L.sorts[k])+'</option>';
  }).join("");

  $("#l-dl").textContent = L.exportLbl;
  $("#dl").innerHTML = '<option value="">'+esc(L.exportLbl)+'</option>'+
    '<option value="json">JSON</option><option value="csv">CSV</option>';
  $("#dl").value = "";

  paintSub();

  $("#l-lang").textContent = lang.toUpperCase();
  $("#lang").innerHTML = '<option value="tr"'+(lang==="tr"?' selected':'')+'>TR</option>'+
                         '<option value="en"'+(lang==="en"?' selected':'')+'>EN</option>';

  var shown = data.filter(keep);
  $("#count").textContent = L.count(shown.length, data.length);

  /* The category list never shrinks. If the others vanish when one is
     picked, you lose your bearings. The selected one is marked, the ones
     with no matches fade, but everything stays where it was. */
  var counts = {};
  var poolNoCat = data.filter(function(d){ return matches(d, true) });
  poolNoCat.forEach(function(d){ counts[d.cat] = (counts[d.cat]||0) + 1 });
  $("#nav").innerHTML = CATS.map(function(c){
    var n = counts[c.key] || 0;
    return '<li><a href="?cat='+c.key+'" data-cat="'+c.key+'" class="'+
           (activeCat===c.key ? "on" : (n ? "" : "empty"))+
           '">'+esc(c[lang])+'<span class="n">'+n+'</span></a></li>';
  }).join("");

  $("#srcbar").innerHTML = '<span class="lbl">'+esc(L.by)+'</span>' +
    Object.keys(SRCMAP).map(function(k){
      if(!SRCCOUNT[k]) return "";
      var sm = SRCMAP[k];
      return '<button class="tag" type="button" data-src="'+esc(k)+'" aria-pressed="'+
             (activeSrc===k)+'" title="'+esc(sm[lang==="tr"?"note_tr":"note_en"])+'"><b>'+
             esc(sm[lang==="tr"?"label_tr":"label_en"])+'</b> '+SRCCOUNT[k]+'</button>';
    }).join("");

  $("#tagbar").innerHTML =
    '<button class="tag pickbtn" type="button" id="pickbtn" aria-pressed="'+onlyPicks+'">'+
    '<span class="dot">◆</span> <b>'+esc(L.picks)+'</b> '+PICKCOUNT+'</button>' +
    tagbarHTML(L);

  /* Tek kayit gorunumu. Bir dizinde tek bir kaydi paylasabilmek gerekiyordu;
     adres kayit adina bagli, yeniden derleme onu kaydirmiyor. */
  if(single){
    var tek = NAMEIDX[single];
    if(tek){
      $("#list").innerHTML = '<section class="one"><h2><span>'+esc(tek.cat_tr && lang==="tr"?tek.cat_tr:tek.cat_en)+
        '</span></h2><div class="grid one-g">'+itemHTML(tek, true)+'</div>'+
        '<p class="onemore"><a href="?cat='+esc(tek.cat)+'" data-cat="'+esc(tek.cat)+'">'+
        esc(L.backCat)+'</a></p></section>';
      return;
    }
    single = null;
  }

  if(recent){
    $("#list").innerHTML = recentHTML(L);
    return;
  }

  /* Giris gorunumu: hicbir suzgec yokken kayit degil kategori gosteriyoruz. */
  if(!activeCat && !q && !activeTags.length && !onlyPicks && !activeSrc && !single && sortBy === "cat"){
    $("#list").innerHTML = homeHTML(L);
    return;
  }

  if(!shown.length){
    $("#list").innerHTML = '<p class="empty">'+L.empty+' <a href="#" id="clr"><code>'+L.clear+'</code></a></p>';
    return;
  }

  if(sortBy === "cat" && !q){
    $("#list").innerHTML = CATS.map(function(c){
      var items = shown.filter(function(d){ return d.cat === c.key });
      return items.length ? block(c.key, c[lang], items, L, false, c.key) : "";
    }).join("");
  } else {
    var label = activeCat
      ? CATS.filter(function(c){ return c.key === activeCat })[0][lang]
      : (q ? L.relevance : L.all);
    $("#list").innerHTML = block("_", label, sorted(shown), L, sortBy === "new", activeCat);
  }
}

function update(push){ writeURL(push); render(); }
function clearAll(){ q=""; activeTags=[]; activeCat=null; onlyPicks=false; activeSrc=null; single=null; recent=false; pages={}; update(true) }

/* ------------------------------------------------------------ olaylar */
var typeTimer;
$("#q").addEventListener("input", function(e){
  q = e.target.value.trim(); single = null; recent = false; pages = {}; render();
  clearTimeout(typeTimer);
  typeTimer = setTimeout(function(){ writeURL(false) }, 400);   /* do not pollute the history stack */
});

$("#sort").addEventListener("change", function(e){
  sortBy = e.target.value; pages = {}; update(true);
});

document.addEventListener("click", function(e){
  var pg = e.target.closest("[data-pg]");
  if(pg){
    var parts = pg.dataset.pg.split(":");
    pages[parts[0]] = parseInt(parts[1], 10);
    update(false);
    var sec = document.getElementById("c-"+parts[0]);
    if(sec) sec.scrollIntoView({block:"start", behavior:"smooth"});
    return;
  }
  var rc = e.target.closest("[data-recent]");
  if(rc){
    e.preventDefault();
    recent = true; single = null; activeCat = null; q = ""; activeTags = [];
    onlyPicks = false; activeSrc = null; pages = {}; update(true); scrollTop();
    return;
  }
  var all = e.target.closest("[data-all]");
  if(all){ e.preventDefault(); sortBy = "az"; single = null; recent = false; pages = {}; update(true); return }
  if(e.target.closest("#tagmore")){ tagsOpen = !tagsOpen; render(); return }
  if(e.target.closest("#pickbtn")){ onlyPicks = !onlyPicks; single = null; recent = false; pages = {}; update(true); return }
  var sb = e.target.closest("[data-src]");
  if(sb){
    var sk = sb.dataset.src;
    activeSrc = (activeSrc === sk) ? null : sk;
    single = null; recent = false; pages = {}; update(true); return;
  }
  var pm = e.target.closest("[data-perma]");
  if(pm){
    e.preventDefault();
    single = pm.dataset.perma; q = ""; activeTags = []; activeCat = null;
    onlyPicks = false; activeSrc = null; pages = {}; update(true); scrollTop();
    return;
  }
  var rl = e.target.closest("[data-rel]");
  if(rl){
    e.preventDefault();
    var target = NAMEIDX[rl.dataset.rel];
    if(target){
      q = target.name; activeTags = []; activeCat = null; onlyPicks = false; activeSrc = null;
      pages = {}; update(true); scrollTop();
    }
    return;
  }
  var tg = e.target.closest("[data-tag]");
  if(tg){
    var t = tg.dataset.tag, i = activeTags.indexOf(t);
    if(i >= 0) activeTags.splice(i,1); else activeTags.push(t);
    single = null; recent = false; pages = {}; update(true); return;
  }
  if(e.target.closest("#clr")){ e.preventDefault(); clearAll(); return; }
  var nv = e.target.closest("[data-cat]");
  if(nv){
    e.preventDefault();
    var c = nv.dataset.cat;
    activeCat = (activeCat === c) ? null : c;
    single = null; recent = false; /* tek kayit ve son eklenenlerden cikiyoruz */
    pages = {}; update(true); scrollTop();
    return;
  }
});

addEventListener("popstate", function(){ readURL(); render() });

$("#back").addEventListener("click", function(){
  activeCat = null; single = null; recent = false;
  pages = {}; update(true); scrollTop();
});

function randomLink(){
  var pool = data.filter(keep);
  if(!pool.length) pool = data;
  window.open(pool[Math.floor(Math.random()*pool.length)].url, "_blank", "noopener");
}
$("#rand").addEventListener("click", randomLink);

function exportRows(){
  return sorted(data.filter(keep)).map(function(d){
    return {name:d.name, url:d.url,
            category:d[lang === "tr" ? "cat_tr" : "cat_en"],
            tags:(d.tags||[]).map(tagLabel),
            source:srcLabel(d),
            added:new Date(d.added*1000).toISOString().slice(0,7),
            verified:d.ver || "",
            description:descOf(d)};
  });
}
function download(name, text, mime){
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type:mime}));
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove() }, 0);
}
$("#dl").addEventListener("change", function(e){
  var kind = e.target.value, rows = exportRows();
  var base = "baglantilar-" + (activeCat || "tumu");
  if(kind === "json"){
    download(base + ".json", JSON.stringify({
      source:"Kullanışlı Siteler", checked:CHECKED, lang:lang,
      filter:{q:q||null, category:activeCat, tags:activeTags, source:activeSrc,
              picksOnly:onlyPicks, sort:sortBy},
      count:rows.length, links:rows
    }, null, 2), "application/json");
  } else if(kind === "csv"){
    var cols = ["name","url","category","tags","source","added","verified","description"];
    var esc2 = function(v){
      v = Array.isArray(v) ? v.join("; ") : (v == null ? "" : String(v));
      return '"' + v.replace(/"/g, '""') + '"';
    };
    var NL = String.fromCharCode(10), BOM = String.fromCharCode(0xFEFF);
    var csv = BOM + cols.join(",") + NL +
      rows.map(function(r){ return cols.map(function(c){ return esc2(r[c]) }).join(",") }).join(NL);
    download(base + ".csv", csv, "text/csv;charset=utf-8");
  }
  e.target.value = "";
});

$("#lang").addEventListener("change", function(e){ setLang(e.target.value) });

function applyTheme(){
  if(theme) document.documentElement.setAttribute("data-theme", theme);
  else document.documentElement.removeAttribute("data-theme");
}
$("#theme").addEventListener("click", function(){
  var dark = matchMedia("(prefers-color-scheme:dark)").matches;
  theme = ((theme || (dark ? "dark" : "light")) === "dark") ? "light" : "dark";
  localStorage.setItem("theme", theme); applyTheme();
});
applyTheme();

/* Back to top, animated by hand. The page runs past 50,000px, where the
   browser's own smooth behaviour either crawls or finishes instantly; a
   fixed 520ms feels the same at every height. */
function scrollTop(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches){ scrollTo(0,0); return }
  var start = scrollY, t0 = performance.now(), dur = 520;
  requestAnimationFrame(function step(now){
    var p = Math.min(1, (now - t0) / dur);
    scrollTo(0, Math.round(start * (1 - (1 - Math.pow(1-p, 3)))));
    if(p < 1) requestAnimationFrame(step);
  });
}
var topBtn = $("#top"), ticking = false;
function syncTop(){
  topBtn.classList.toggle("show",
    document.querySelector("header").getBoundingClientRect().bottom < 0);
}
addEventListener("scroll", function(){
  if(ticking) return;
  ticking = true;
  requestAnimationFrame(function(){ syncTop(); ticking = false });
}, {passive:true});
if("IntersectionObserver" in window){
  new IntersectionObserver(syncTop).observe(document.querySelector("header"));
}
topBtn.addEventListener("click", scrollTop);
window.__syncTop = syncTop;

document.addEventListener("keydown", function(e){
  /* While the dialog is open, / and r must not fire. <dialog> handles Esc. */
  if(dlg.open) return;
  var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(e.key === "/" && !typing){ e.preventDefault(); $("#q").focus() }
  if(e.key === "r" && !typing && !e.ctrlKey && !e.metaKey && !e.altKey){ randomLink() }
  if(e.key === "Escape"){ clearAll(); $("#q").blur() }
});

/* ------------------------------------------------------------ submissions
   There is no backend and there will not be one. What gets submitted goes
   straight into a GitHub issue; the directory's data only changes when
   build.py runs and someone pushes. Nothing here can reach the site on its
   own -- a person reads it first.

   Files are parsed in the browser too. A bookmark export can hold personal
   things; none of it is uploaded anywhere, and there is nowhere to upload
   it to. */

var dlg = $("#sub"), subTab = "one", bulkNew = [], bulkStat = null;

function nkey(u){
  return String(u).trim().toLowerCase()
    .replace(/^https?:\/\//, "").replace(/^www\./, "").replace(/\/+$/, "");
}
function bare(k){ return k.replace(/[?#].*$/, "").replace(/\/+$/, "") }

/* Index of what is already here. Both the full and the query-stripped
   form, so the same page arriving with "?utm_source=..." is not counted
   as something new. */
var HAVE = {};
data.forEach(function(d){
  var k = nkey(d.url);
  HAVE[k] = d.name;
  if(!HAVE[bare(k)]) HAVE[bare(k)] = d.name;
});
function known(u){ var k = nkey(u); return HAVE[k] || HAVE[bare(k)] || null }

function unent(t){ var e = document.createElement("textarea"); e.innerHTML = t; return e.value }

/* Netscape bookmark export: Chrome, Firefox, Edge and Safari all emit this. */
function parseBM(txt){
  var out = [], re = /<a\s[^>]*href="([^"]*)"[^>]*>([\s\S]*?)<\/a>/gi, m;
  while((m = re.exec(txt))){
    if(!/^https?:/i.test(m[1])) continue;
    out.push({ url: unent(m[1]), name: unent(m[2].replace(/<[^>]*>/g, "")).trim() });
  }
  return out;
}

function parseJS(txt){
  var j = JSON.parse(txt);
  var arr = Array.isArray(j) ? j : (j.links || j.items || j.data || j.bookmarks || []);
  if(!Array.isArray(arr)) return [];
  return arr.map(function(x){
    if(typeof x === "string") return { url: x, name: "" };
    if(!x || typeof x !== "object") return { url: "", name: "" };
    return { url: x.url || x.href || x.link || x.uri || "",
             name: x.name || x.title || x.label || "" };
  }).filter(function(x){ return /^https?:/i.test(x.url) });
}

/* The separator comes from the header row: Turkish Excel writes ';'. */
function parseCSV(txt){
  txt = txt.replace(/^﻿/, "");
  var head = txt.split(/\r?\n/)[0] || "";
  var sep = (head.split(";").length > head.split(",").length) ? ";" : ",";
  var rows = [], row = [], cur = "", inq = false, i, c;
  for(i = 0; i < txt.length; i++){
    c = txt.charAt(i);
    if(inq){
      if(c === '"'){ if(txt.charAt(i+1) === '"'){ cur += '"'; i++ } else inq = false }
      else cur += c;
    }
    else if(c === '"') inq = true;
    else if(c === sep){ row.push(cur); cur = "" }
    else if(c === "\n"){ row.push(cur); rows.push(row); row = []; cur = "" }
    else if(c !== "\r") cur += c;
  }
  row.push(cur); rows.push(row);
  rows = rows.filter(function(r){ return r.join("").trim() !== "" });
  if(!rows.length) return [];

  var hdr = rows[0].map(function(x){ return x.trim().toLowerCase() });
  var ui = -1, ni = -1, k;
  for(k = 0; k < hdr.length; k++){
    if(ui < 0 && /url|link|adres|address|href/.test(hdr[k])) ui = k;
    if(ni < 0 && /name|title|isim|baslik|başlık/.test(hdr[k])) ni = k;
  }
  var body = rows.slice(1);
  if(ui < 0){                       /* no header row: find the URL column by looking at the values */
    body = rows;
    for(k = 0; k < rows[0].length; k++){
      if(/^\s*https?:/i.test(rows[0][k] || "")){ ui = k; break }
    }
    if(ui < 0) return [];
    ni = ui === 0 ? 1 : 0;
  }
  return body.map(function(r){
    return { url: (r[ui] || "").trim(), name: ni >= 0 ? (r[ni] || "").trim() : "" };
  }).filter(function(x){ return /^https?:/i.test(x.url) });
}

function issueURL(f){
  var u = new URLSearchParams();
  u.set("template", "new-link.yml");
  u.set("title", "[link] " + (f.name || host(f.url) || ""));
  u.set("url", f.url);
  u.set("name", f.name || "");
  u.set("cat", f.cat || "Not sure");
  u.set("what", f.what || "");
  u.set("diff", f.diff || "");
  return REPO + "/issues/new?" + u.toString();
}

function bulkURL(list){
  var body = list.map(function(x){
    return "- [ ] " + (x.name ? x.name + " — " : "") + x.url;
  }).join("\n");
  var u = new URLSearchParams();
  u.set("title", "[toplu] " + list.length + " bağlantı önerisi");
  u.set("labels", "new-link");
  u.set("body", "Dizinde bulunmayan bağlantılar:\n\n" + body);
  return REPO + "/issues/new?" + u.toString();
}

function readForm(){
  return { url:  $("#f-url").value.trim(),
           name: $("#f-name").value.trim(),
           cat:  $("#f-cat").value,
           what: $("#f-what").value.trim(),
           diff: $("#f-diff").value.trim() };
}
function asText(f){
  var L = T[lang];
  return "- " + (f.name || "") + " — " + f.url + "\n" +
         "  " + L.lCat  + ": " + f.cat + "\n" +
         "  " + L.lWhat + " " + f.what + "\n" +
         "  " + L.lDiff + " " + f.diff;
}

function copy(text, btn){
  var old = btn.textContent;
  var done = function(){
    btn.textContent = T[lang].copied;
    setTimeout(function(){ btn.textContent = old }, 1400);
  };
  var manual = function(){
    var t = document.createElement("textarea");
    t.value = text; t.setAttribute("readonly", "");
    t.style.cssText = "position:fixed;top:-1000px";
    document.body.appendChild(t); t.select();
    try{ document.execCommand("copy"); done() }catch(e){}
    t.remove();
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, manual);
  } else manual();
}

/* ------------------------------------------------------------ toplu dosya */
function showBulk(items){
  var L = T[lang], seen = {}, fresh = [], dup = 0;
  items.forEach(function(x){
    var k = bare(nkey(x.url));
    if(!k || seen[k]) return;
    seen[k] = 1;
    if(known(x.url)) dup++; else fresh.push(x);
  });
  bulkNew  = fresh;
  bulkStat = { read: items.length, dup: dup };

  $("#s-res").hidden = false;
  $("#s-stat").innerHTML = L.stat("<b>"+items.length+"</b>",
                                  "<b>"+dup+"</b>", "<b>"+fresh.length+"</b>");
  $("#s-plist").innerHTML = fresh.length
    ? fresh.slice(0, 300).map(function(x){
        return "<div>" + esc(x.name || host(x.url) || x.url) +
               "<span>" + esc(x.url) + "</span></div>";
      }).join("")
    : '<div style="color:var(--dim);padding:12px 0">' + esc(L.noneNew) + "</div>";
  paintFoot();
}

function takeFile(file){
  if(!file) return;
  var r = new FileReader();
  r.onload = function(){
    var txt = String(r.result || ""), items = [];
    try{
      if(/\.json$/i.test(file.name))     items = parseJS(txt);
      else if(/\.csv$/i.test(file.name)) items = parseCSV(txt);
      else                               items = parseBM(txt);
    }catch(e){ items = [] }
    /* The extension can lie. If nothing came out, try the other parsers. */
    if(!items.length){
      try{ items = parseBM(txt) }catch(e){}
      if(!items.length){ try{ items = parseJS(txt) }catch(e){} }
      if(!items.length){ try{ items = parseCSV(txt) }catch(e){} }
    }
    if(!items.length){
      $("#s-res").hidden = false;
      $("#s-stat").textContent = T[lang].badFile;
      $("#s-plist").innerHTML = "";
      bulkNew = []; bulkStat = null; paintFoot();
      return;
    }
    showBulk(items);
  };
  r.readAsText(file, "utf-8");
}

/* --------------------------------------------------------- footer buttons */
function paintFoot(){
  var L = T[lang], f = $("#s-foot");
  if(subTab === "one"){
    f.innerHTML = '<button class="btn primary" id="b-issue" type="button">'+esc(L.bIssue)+'</button>'+
                  '<button class="btn" id="b-copy" type="button">'+esc(L.bCopy)+'</button>'+
                  '<span class="msg"></span>';
    $("#b-issue").addEventListener("click", function(){
      var v = readForm();
      if(!v.url){ $("#s-warn").textContent = L.needUrl; $("#f-url").focus(); return }
      window.open(issueURL(v), "_blank", "noopener");
    });
    $("#b-copy").addEventListener("click", function(){
      var v = readForm();
      if(!v.url){ $("#s-warn").textContent = L.needUrl; $("#f-url").focus(); return }
      copy(asText(v), this);
    });
    return;
  }

  var n = bulkNew.length;
  var url = n ? bulkURL(bulkNew) : "";
  var fits = n > 0 && url.length < 7000;
  f.innerHTML = '<button class="btn primary" id="b-issue" type="button"'+(fits?"":" disabled")+'>'+
                  esc(L.bIssue)+'</button>'+
                '<button class="btn" id="b-json" type="button"'+(n?"":" disabled")+'>'+esc(L.bJson)+'</button>'+
                '<button class="btn" id="b-csv" type="button"'+(n?"":" disabled")+'>'+esc(L.bCsv)+'</button>'+
                '<span class="msg">'+(n && !fits ? esc(L.tooBig(n)) : "")+'</span>';
  if(fits) $("#b-issue").addEventListener("click", function(){
    window.open(url, "_blank", "noopener");
  });
  if(n){
    $("#b-json").addEventListener("click", function(){
      download("yeni-baglantilar.json", JSON.stringify(bulkNew, null, 2), "application/json");
    });
    $("#b-csv").addEventListener("click", function(){
      var NL = String.fromCharCode(10), BOM = String.fromCharCode(0xFEFF);
      var q2 = function(v){ return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"' };
      download("yeni-baglantilar.csv",
        BOM + "name,url" + NL +
        bulkNew.map(function(x){ return q2(x.name) + "," + q2(x.url) }).join(NL),
        "text/csv;charset=utf-8");
    });
  }
}

function paintSub(){
  var L = T[lang];
  $("#addbtn").textContent  = L.add;
  $("#s-title").textContent = L.sTitle;
  $("#s-t1").textContent    = L.sTab1;
  $("#s-t2").textContent    = L.sTab2;
  $("#s-note").innerHTML    = subTab === "one" ? L.sNote : L.sNoteB;
  $("#l-name").textContent  = L.lName;
  $("#l-cat").textContent   = L.lCat;
  $("#l-what").textContent  = L.lWhat;
  $("#l-diff").textContent  = L.lDiff;
  $("#f-what").placeholder  = L.phWhat;
  $("#f-diff").placeholder  = L.phDiff;
  $("#s-drop").innerHTML    = L.drop;

  /* The label follows the language but the submitted value is always
     English: it has to match the issue template's dropdown exactly, or
     GitHub silently ignores the selection. */
  $("#f-cat").innerHTML = CATS.map(function(c){
    return '<option value="'+esc(c.en)+'">'+esc(lang === "tr" ? c.tr : c.en)+'</option>';
  }).join("") + '<option value="Not sure">'+esc(L.catAsk)+'</option>';

  if(bulkStat) $("#s-stat").innerHTML = L.stat("<b>"+bulkStat.read+"</b>",
    "<b>"+bulkStat.dup+"</b>", "<b>"+bulkNew.length+"</b>");
  paintFoot();
}

function setTab(t, focus){
  subTab = t;
  $("#s-t1").setAttribute("aria-selected", t === "one");
  $("#s-t2").setAttribute("aria-selected", t === "bulk");
  /* role="tablist" promises arrow-key navigation: only the selected tab
     stays in the Tab order, the other is reached with the arrows. */
  $("#s-t1").tabIndex = t === "one"  ? 0 : -1;
  $("#s-t2").tabIndex = t === "bulk" ? 0 : -1;
  if(focus) $(t === "one" ? "#s-t1" : "#s-t2").focus();
  $("#s-one").hidden  = t !== "one";
  $("#s-bulk").hidden = t === "one";
  $("#s-note").innerHTML = T[lang][t === "one" ? "sNote" : "sNoteB"];
  paintFoot();
}

$("#addbtn").addEventListener("click", function(){ paintSub(); dlg.showModal() });
$("#s-close").addEventListener("click", function(){ dlg.close() });
$("#s-t1").addEventListener("click", function(){ setTab("one") });
$("#s-t2").addEventListener("click", function(){ setTab("bulk") });
$(".sub-tabs").addEventListener("keydown", function(e){
  if(e.key === "ArrowRight" || e.key === "ArrowLeft"){
    e.preventDefault();
    setTab(subTab === "one" ? "bulk" : "one", true);
  }
});

/* Close on a click outside the panel. <dialog> does not do this itself. */
dlg.addEventListener("click", function(e){
  if(e.target !== dlg) return;
  var r = dlg.getBoundingClientRect();
  if(e.clientX < r.left || e.clientX > r.right ||
     e.clientY < r.top  || e.clientY > r.bottom) dlg.close();
});

$("#f-url").addEventListener("input", function(){
  var hit = this.value.trim() ? known(this.value) : null;
  $("#s-warn").textContent = hit ? T[lang].dupWarn(hit) : "";
});

$("#s-drop").addEventListener("click", function(){ $("#s-file").click() });
$("#s-drop").addEventListener("keydown", function(e){
  if(e.key === "Enter" || e.key === " "){ e.preventDefault(); $("#s-file").click() }
});
$("#s-file").addEventListener("change", function(){ takeFile(this.files[0]); this.value = "" });
["dragenter","dragover"].forEach(function(ev){
  $("#s-drop").addEventListener(ev, function(e){ e.preventDefault(); this.classList.add("over") });
});
["dragleave","drop"].forEach(function(ev){
  $("#s-drop").addEventListener(ev, function(e){ e.preventDefault(); this.classList.remove("over") });
});
$("#s-drop").addEventListener("drop", function(e){
  takeFile(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]);
});


readURL();
if(lang === "en") setLang("en"); else render();
})();
</script>
